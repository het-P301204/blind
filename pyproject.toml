[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blind"
version = "0.1.0"
description = "BLIND — Detection Coverage Intelligence Platform"
authors = [{ name = "het-P301204", email = "patel.hetb@northeastern.edu" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.2",
    "pydantic>=2.7.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "typer>=0.12.3",
    "rich>=13.7.1",
    "aiofiles>=23.2.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "stix2>=3.0.1",
    "reportlab>=4.2.0",
    "weasyprint>=62.0",
    "jinja2>=3.1.4",
    "python-dateutil>=2.9.0",
    "xxhash>=3.4.1",
    "anyio>=4.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.7",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0.12",
    "types-python-dateutil>=2.9.0",
]

[project.scripts]
blind = "blind_engine.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["blind_engine*", "apps*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
